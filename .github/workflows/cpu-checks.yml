name: CPU contracts and source smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OPENCV_IO_ENABLE_OPENEXR: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install declared CPU and optional desktop test stack
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt
          python -m pip check
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Offscreen Qt runtime import PASS')"
      - name: Observe Windows path and descriptor stat identities
        if: runner.os == 'Windows'
        run: |
          @'
          import os, platform, sys, tempfile
          from pathlib import Path
          print("Diagnostic only, not an acceptance check", sys.version, platform.platform())
          fields = ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns", "st_nlink")
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder) / "generated-stat-probe.bin"
              path.write_bytes(b"corridorkey-stat-diagnostic")
              with path.open("rb") as stream:
                  path_stat = os.stat(path, follow_symlinks=False)
                  descriptor_stat = os.fstat(stream.fileno())
                  print("path_stat", {name: getattr(path_stat, name) for name in fields})
                  print("descriptor_stat", {name: getattr(descriptor_stat, name) for name in fields})
          '@ | python -
      - name: Unit, integration, offscreen Qt and available native harness tests
        run: python -m unittest discover -s tests -v --failfast
      - name: Source dispatcher and worker smoke (no inference)
        run: |
          python -c "from pathlib import Path; Path('benchmark-results/ci-smoke').mkdir(parents=True, exist_ok=True)"
          python -m corridorkey.desktop_smoke --source --output-parent benchmark-results/ci-smoke
      - name: Full static regression gate (known debt remains visible)
        if: always()
        run: python scripts/code_health.py --output-dir benchmark-results/ci-health
      - name: Preserve raw static reports in job logs even when the gate fails
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('benchmark-results/ci-health')
          for name in ('health.json', 'ruff.json', 'pyright.json', 'ruff-stderr.txt', 'pyright-stderr.txt', 'imports.txt'):
              path = root / name
              content = path.read_text(encoding='utf-8', errors='strict') if path.is_file() else None
              # Escaped, bounded records avoid workflow commands and oversized log lines.
              for offset in range(0, max(len(content or ''), 1), 4096):
                  print(json.dumps({'report': name, 'offset': offset, 'content': content[offset:offset + 4096] if content is not None else None}, ensure_ascii=True))
